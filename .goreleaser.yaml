# This is an example .goreleaser.yml file with some sensible defaults.
# Make sure to check the documentation at https://goreleaser.com

# The lines below are called `modelines`. See `:help modeline`
# Feel free to remove those if you don't want/need to use them.
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

before:
  hooks:
    # You may remove this if you don't use go modules.
    - go mod tidy
    # Use the same API and web generation paths as CI.
    - npm --prefix web ci
    - ./tools/generate_api.sh
    - ./tools/generate_web.sh

builds:
  - id: tdns
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    binary: tdns
    flags:
      - -a
      - -trimpath
    goarch:
      - amd64
      - arm64

dockers:
  - id: tdns-amd64
    ids:
      - tdns
    goos: linux
    goarch: amd64
    dockerfile: Dockerfile
    use: buildx
    image_templates:
      - "git.kubewire.net/jfardello/tdns:{{ .Tag }}-amd64"
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--pull"
      - "--build-arg=VERSION={{ .Version }}"
      - "--build-arg=REVISION={{ .FullCommit }}"
      - "--build-arg=CREATED={{ .Date }}"
  - id: tdns-arm64
    ids:
      - tdns
    goos: linux
    goarch: arm64
    dockerfile: Dockerfile
    use: buildx
    image_templates:
      - "git.kubewire.net/jfardello/tdns:{{ .Tag }}-arm64"
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--pull"
      - "--build-arg=VERSION={{ .Version }}"
      - "--build-arg=REVISION={{ .FullCommit }}"
      - "--build-arg=CREATED={{ .Date }}"

docker_manifests:
  - name_template: "git.kubewire.net/jfardello/tdns:{{ .Tag }}"
    image_templates:
      - "git.kubewire.net/jfardello/tdns:{{ .Tag }}-amd64"
      - "git.kubewire.net/jfardello/tdns:{{ .Tag }}-arm64"
  - name_template: "{{ if not .Prerelease }}git.kubewire.net/jfardello/tdns:latest{{ end }}"
    image_templates:
      - "git.kubewire.net/jfardello/tdns:{{ .Tag }}-amd64"
      - "git.kubewire.net/jfardello/tdns:{{ .Tag }}-arm64"

archives:
  - formats: ['tar.gz']
    builds_info:
      owner: root
      group: root
      mtime: "{{ .CommitDate }}"
      mode: 0755
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: ['zip']
    files:
      - src: LICENSE
        info:
          owner: root
          group: root
          mtime: "{{ .CommitDate }}"
          mode: 0644
      - src: README.md
        info:
          owner: root
          group: root
          mtime: "{{ .CommitDate }}"
          mode: 0644

release:
  gitea:
    owner: jfardello
    name: tdns

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
gitea_urls:
  api: https://git.kubewire.net/api/v1
  download: https://git.kubewire.net
