<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TDNS installation, security, contribution, and web interface documentation.">
  <meta name="theme-color" content="#0f766e">
  <title>TDNS Documentation</title>
  <link rel="icon" type="image/png" href="assets/tdns.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/themes/vue.css">
  <link rel="stylesheet" href="assets/theme.css">
</head>
<body>
  <div id="app">Loading TDNS documentation...</div>
  <script>
    window.$docsify = {
      name: 'TDNS',
      logo: 'assets/tdns.png',
      repo: 'https://github.com/jfardello/tdns',
      homepage: 'README.md',
      loadNavbar: true,
      loadSidebar: true,
      relativePath: true,
      auto2top: true,
      subMaxLevel: 2,
      maxLevel: 3,
      alias: {
        '/.*/_navbar.md': '/_navbar.md',
        '/.*/_sidebar.md': '/_sidebar.md'
      },
      search: {
        placeholder: 'Search documentation',
        noData: 'No matching documentation',
        depth: 3
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/search.min.js"></script>
</body>
</html>
