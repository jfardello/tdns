name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64,arm

      - name: Set up GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.17.0
          install-only: true

      - name: Check GoReleaser configuration
        run: goreleaser check

      - name: Install web and API generation dependencies
        run: npm --prefix web ci

      - name: Audit production web dependencies
        run: npm --prefix web audit --omit=dev --audit-level=critical

      - name: Verify generated files, tests, and web build
        run: ./tools/verify.sh

      - name: Build Linux release snapshot
        run: goreleaser release --snapshot --clean --skip=before,docker

      - name: Verify Linux release artifacts
        run: |
          set -eu

          for target in x86_64 arm64 armv7; do
            archive="tdns_Linux_${target}.tar.gz"
            test -f "dist/${archive}"
            grep -Fq "  ${archive}" dist/checksums.txt
            mkdir "/tmp/tdns-${target}"
            tar -xzf "dist/${archive}" -C "/tmp/tdns-${target}"
          done

          (
            cd dist
            sha256sum --check checksums.txt
          )

          file /tmp/tdns-x86_64/tdns | grep -q 'statically linked.*stripped'
          file /tmp/tdns-arm64/tdns | grep -q 'statically linked.*stripped'
          file /tmp/tdns-armv7/tdns | grep -q 'statically linked.*stripped'

          go version -m /tmp/tdns-x86_64/tdns | grep -q 'GOARCH=amd64'
          go version -m /tmp/tdns-arm64/tdns | grep -q 'GOARCH=arm64'
          go version -m /tmp/tdns-armv7/tdns | grep -q 'GOARCH=arm'
          go version -m /tmp/tdns-armv7/tdns | grep -q 'GOARM=7'

          /tmp/tdns-x86_64/tdns --version | grep -q '^tdns version '
          /tmp/tdns-arm64/tdns --version | grep -q '^tdns version '
          /tmp/tdns-armv7/tdns --version | grep -q '^tdns version '
