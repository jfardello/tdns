basePath: /
consumes:
- application/json
definitions:
  api.AddMemberRequest:
    properties:
      members:
        items:
          type: string
        type: array
    type: object
  api.AddTagRequest:
    properties:
      name:
        example: trusted
        type: string
    type: object
  api.BlacklistExcludesRequest:
    properties:
      excludes:
        items:
          type: string
        type: array
    type: object
  api.BlacklistHostsRequest:
    properties:
      hosts:
        items:
          type: string
        type: array
    type: object
  api.BlacklistStatus:
    properties:
      blockfile_total_entries:
        type: integer
      enabled:
        type: boolean
      excludes:
        items:
          type: string
        type: array
      external_file:
        type: string
      external_pull_period:
        type: string
      external_repo:
        type: string
      external_repo_branch:
        type: string
      file:
        type: string
      persisted_excludes:
        items:
          type: string
        type: array
      persisted_hosts:
        items:
          type: string
        type: array
      runtime_whitelist:
        items:
          type: string
        type: array
    type: object
  api.BlacklistWhitelistRequest:
    properties:
      domains:
        items:
          type: string
        type: array
    type: object
  api.BrowserCodeExchangeRequest:
    properties:
      code:
        type: string
    type: object
  api.BrowserSessionResponse:
    properties:
      csrf_token:
        type: string
      expires_at:
        format: date-time
        type: string
      scope:
        type: string
      subject:
        type: string
    type: object
  api.CacheExcludeRequest:
    properties:
      excludes:
        items:
          type: string
        type: array
    type: object
  api.CacheStatus:
    properties:
      enabled:
        type: boolean
      excludes:
        items:
          type: string
        type: array
      hits:
        type: integer
      misses:
        type: integer
      ttl:
        type: integer
    type: object
  api.ClientCandidate:
    properties:
      address:
        example: 192.0.2.10
        type: string
      host:
        example: office
        type: string
    type: object
  api.DNSLogAliasRequest:
    properties:
      addr:
        example: 192.0.2.10
        type: string
      name:
        example: office
        type: string
    type: object
  api.DashboardHourlyPoint:
    properties:
      allowed_queries:
        type: integer
      blocked_queries:
        type: integer
      hour_bucket:
        type: integer
      hour_start:
        type: string
      total_queries:
        type: integer
    type: object
  api.DashboardSummary:
    properties:
      allowed_queries:
        type: integer
      blocked_queries:
        type: integer
      cache_hits:
        type: integer
      cache_misses:
        type: integer
      total_queries:
        type: integer
    type: object
  api.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  api.HostEntry:
    properties:
      address:
        example: 192.0.2.10
        type: string
      domain:
        example: example.com
        type: string
    type: object
  api.KnownHost:
    properties:
      address:
        example: 192.0.2.10
        type: string
      host:
        example: office
        type: string
    type: object
  api.LogDetails:
    properties:
      counter:
        example: 42
        minimum: 0
        type: integer
      domain:
        example: example.com.
        type: string
      host:
        example: office
        type: string
    type: object
  api.MemberLabelsRequest:
    properties:
      address:
        example: 192.0.2.10
        type: string
      tags:
        items:
          type: string
        type: array
    type: object
  api.ReplaceMemberLabelsRequest:
    properties:
      tags:
        items:
          type: string
        type: array
    type: object
  api.Response:
    properties:
      blacklist:
        $ref: '#/definitions/api.BlacklistStatus'
      cache:
        $ref: '#/definitions/api.CacheStatus'
      clients:
        items:
          $ref: '#/definitions/api.ClientCandidate'
        type: array
      current_status:
        example: enabled
        type: string
      hourly:
        items:
          $ref: '#/definitions/api.DashboardHourlyPoint'
        type: array
      items:
        items:
          type: string
        type: array
      kind:
        example: api.tdns/cache/response
        type: string
      known_hosts:
        items:
          $ref: '#/definitions/api.KnownHost'
        type: array
      log_items:
        items:
          $ref: '#/definitions/api.LogDetails'
        type: array
      message:
        example: Status OK
        type: string
      static_response:
        $ref: '#/definitions/api.StaticResponseStatus'
      stub_resolver:
        $ref: '#/definitions/api.StubResolverStatus'
      summary:
        $ref: '#/definitions/api.DashboardSummary'
      tag_members:
        items:
          $ref: '#/definitions/api.TagMember'
        type: array
      window_hours:
        maximum: 336
        minimum: 1
        type: integer
      zen_mode:
        $ref: '#/definitions/api.ZenModeStatus'
    type: object
  api.StaticReplaceRequest:
    properties:
      hosts:
        items:
          type: string
        type: array
    type: object
  api.StaticResponseStatus:
    properties:
      configured_hosts:
        items:
          $ref: '#/definitions/api.HostEntry'
        type: array
      enabled:
        type: boolean
      file:
        type: string
      labels:
        items:
          type: string
        type: array
      persisted_hosts:
        items:
          $ref: '#/definitions/api.HostEntry'
        type: array
      runtime_hosts:
        items:
          $ref: '#/definitions/api.HostEntry'
        type: array
    type: object
  api.StubReplaceRequest:
    properties:
      stubs:
        items:
          type: string
        type: array
    type: object
  api.StubResolverStatus:
    properties:
      configured_stubs:
        items:
          type: string
        type: array
      enabled:
        type: boolean
      runtime_stubs:
        items:
          type: string
        type: array
    type: object
  api.TagMember:
    properties:
      address:
        example: 192.0.2.10
        type: string
      has_host_alias:
        type: boolean
      host:
        example: office
        type: string
    type: object
  api.ZenExcludesRequest:
    properties:
      excludes:
        items:
          type: string
        type: array
    type: object
  api.ZenModeStatus:
    properties:
      configured_domains:
        items:
          type: string
        type: array
      configured_excludes:
        items:
          type: string
        type: array
      duration_minutes:
        type: integer
      enabled:
        type: boolean
      ends_at:
        type: string
      file:
        type: string
      labels:
        items:
          type: string
        type: array
      persisted_domains:
        items:
          type: string
        type: array
      persisted_excludes:
        items:
          type: string
        type: array
      remaining_seconds:
        type: integer
      runtime_domains:
        items:
          type: string
        type: array
      started_at:
        type: string
    type: object
  api.ZenReplaceRequest:
    properties:
      zen_domains:
        items:
          type: string
        type: array
    type: object
info:
  contact: {}
  description: Configure and inspect a running TDNS server.
  title: TDNS Management API
  version: "1.0"
paths:
  /api/auth/exchange:
    post:
      description: Consume a single-use browser login code and create a browser session.
      operationId: browserCodeExchange
      parameters:
      - description: Browser login code
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.BrowserCodeExchangeRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.BrowserSessionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Exchange browser login code
      tags:
      - authentication
  /api/auth/logout:
    post:
      description: Revoke and clear the active browser session.
      operationId: browserSessionLogout
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Log out browser session
      tags:
      - authentication
  /api/auth/session:
    get:
      description: Return the active browser session and issue a CSRF token.
      operationId: browserSessionGet
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.BrowserSessionResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Get browser session
      tags:
      - authentication
  /api/blacklist:
    get:
      description: Return blacklist sources, exclusions, and runtime state.
      operationId: blacklistStatus
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Response'
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Response'
      security:
      - BearerAuth: []
      - CookieAuth: []
      summary: Get blacklist status
      tags:
      - blacklist
  /api/blacklist/{action}:
    post:
      description: Enable or disable blacklist filtering.
      operationId: blacklistToggle
      parameters:
      - description: Requested state
        enum:
        - start
        - stop
        in: path
        name: action
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Response'
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Response'
      security:
      - BearerAuth: []
      - CookieAuth: []
      summary: Toggle blacklist filtering
      tags:
      - blacklist
  /api/blacklist/persisted/excludes:
    post:
      description: Replace blacklist exclusion selectors stored in configuration overrides.
      operationId: blacklistPersistedExcludesReplace
      parameters:
      - description: Persisted blacklist exclusions
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.BlacklistExcludesRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Response'
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Response'
      security:
      - BearerAuth: []
      - CookieAuth: []
      summary: Replace persisted blacklist exclusions
      tags:
      - blacklist
  /api/blacklist/persisted/hosts:
    post:
      description: Replace additional blocked hosts stored in configuration overrides.
      operationId: blacklistPersistedHostsReplace
      parameters:
      - description: Persisted blacklist hosts
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.BlacklistHostsRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Response'
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Response'
      security:
      - BearerAuth: []
      - CookieAuth: []
      summary: Replace persisted blacklist hosts
      tags:
      - blacklist
  /api/blacklist/whitelist:
    post:
      description: Add domains to the in-memory blacklist whitelist.
      operationId: blacklistRuntimeWhitelistAdd
      parameters:
      - description: Runtime whitelist domains
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.BlacklistWhitelistRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Response'
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Response'
      security:
      - BearerAuth: []
      - CookieAuth: []
      summary: Add runtime whitelist domains
      tags:
      - blacklist
  /api/cache:
    delete:
      description: Delete all currently cached DNS responses.
      operationId: cacheClear
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Response'
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
      security:
      - BearerAuth: []
      - CookieAuth: []
      summary: Clear the DNS cache
      tags:
      - cache
    get:
      description: Return cache configuration and counters.
      operationId: cacheStatus
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Response'
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
      security:
      - BearerAuth: []
      - CookieAuth: []
      summary: Get cache status
      tags:
      - cache
  /api/cache/{action}:
    post:
      description: Enable or disable the cache and persist the selected state.
      operationId: cacheToggle
      parameters:
      - description: Requested state
        enum:
        - start
        - stop
        in: path
        name: action
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Response'
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Response'
      security:
      - BearerAuth: []
      - CookieAuth: []
      summary: Toggle the DNS cache
      tags:
      - cache
  /api/cache/excludes:
    post:
      description: Replace and persist selectors excluded from caching.
      operationId: cacheExcludesReplace
      parameters:
      - description: Cache exclusion selectors
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.CacheExcludeRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Response'
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Response'
      security:
      - BearerAuth: []
      - CookieAuth: []
      summary: Replace cache exclusions
      tags:
      - cache
  /api/dns-log/alias:
    post:
      description: Associate a client IP address with a display name.
      operationId: dnsLogAliasSet
      parameters:
      - description: Client alias
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.DNSLogAliasRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Response'
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
      security:
      - BearerAuth: []
      - CookieAuth: []
      summary: Set a DNS client alias
      tags:
      - dns-log
  /api/dns-log/clients:
    get:
      description: Search observed clients by address or alias.
      operationId: dnsLogClientsSearch
      parameters:
      - description: Address or alias substring
        in: query
        name: search
        type: string
      - default: 20
        description: Maximum result count
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Response'
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
      security:
      - BearerAuth: []
      - CookieAuth: []
      summary: Search DNS clients
      tags:
      - dns-log
  /api/dns-log/dashboard:
    get:
      description: Return summary and hourly query statistics.
      operationId: dnsLogDashboard
      parameters:
      - default: 24
        description: Dashboard window in hours
        in: query
        maximum: 336
        minimum: 1
        name: hours
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Response'
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
      security:
      - BearerAuth: []
      - CookieAuth: []
      summary: Get DNS log dashboard
      tags:
      - dns-log
  /api/dns-log/rotate:
    post:
      description: Delete DNS log entries selected by a relative duration.
      operationId: dnsLogRotate
      parameters:
      - description: Relative age such as 24h or 1w
        in: query
        name: since
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Response'
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
      security:
      - BearerAuth: []
      - CookieAuth: []
      summary: Rotate DNS log entries
      tags:
      - dns-log
  /api/dns-log/top/{top}:
    get:
      description: Return top domains with optional status and client filters.
      operationId: dnsLogTop
      parameters:
      - description: Maximum result count
        in: path
        maximum: 50
        minimum: 1
        name: top
        required: true
        type: integer
      - description: Relative age such as 24h or 1w
        in: query
        name: since
        type: string
      - description: Query disposition
        enum:
        - blocked
        - allowed
        in: query
        name: status
        type: string
      - description: Client alias or IP address
        in: query
        name: client
        type: string
      - description: Client matching mode
        enum:
        - host
        - ip
        in: query
        name: client_mode
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Response'
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
      security:
      - BearerAuth: []
      - CookieAuth: []
      summary: Get top queried domains
      tags:
      - dns-log
  /api/static-response:
    get:
      description: Return configured, persisted, and runtime static hosts.
      operationId: staticResponseStatus
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Response'
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Response'
      security:
      - BearerAuth: []
      - CookieAuth: []
      summary: Get static response status
      tags:
      - static-response
    post:
      description: Replace static hosts held in memory.
      operationId: staticResponseReplace
      parameters:
      - description: Runtime hosts file lines
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.StaticReplaceRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Response'
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Response'
      security:
      - BearerAuth: []
      - CookieAuth: []
      summary: Replace runtime static hosts
      tags:
      - static-response
  /api/static-response/{action}:
    post:
      description: Enable or disable static DNS responses.
      operationId: staticResponseToggle
      parameters:
      - description: Requested state
        enum:
        - start
        - stop
        in: path
        name: action
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Response'
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Response'
      security:
      - BearerAuth: []
      - CookieAuth: []
      summary: Toggle static responses
      tags:
      - static-response
  /api/static-response/persisted:
    post:
      description: Replace static hosts stored in configuration overrides.
      operationId: staticResponsePersistedReplace
      parameters:
      - description: Persisted hosts file lines
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.StaticReplaceRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Response'
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Response'
      security:
      - BearerAuth: []
      - CookieAuth: []
      summary: Replace persisted static hosts
      tags:
      - static-response
  /api/stub-resolver:
    get:
      description: Return configured and runtime stub resolver state.
      operationId: stubResolverStatus
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Response'
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
      security:
      - BearerAuth: []
      - CookieAuth: []
      summary: Get stub resolver status
      tags:
      - stub-resolver
    post:
      description: Replace the in-memory stub resolver entries.
      operationId: stubResolverReplace
      parameters:
      - description: Stub resolver entries
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.StubReplaceRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Response'
        "401":
          description: Unauthorized
          schema:
