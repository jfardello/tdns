timeout: 1000
upstream_timeout: 300
verify_tls: true
enable_api: false
loglevel: INFO
upstreams:
  - tls://1.1.1.1:853#cloudflare-dns.com
  - tls://1.0.0.1:853#cloudflare-dns.com
cache:
  enabled: true
  ttl: 5
  excludes: []
cors:
  enabled: false
  allowed_origins:
    - http://localhost:3000
    - https://localhost:3000
dns_log:
  enabled: true
  purge: 30d
database:
  file: /var/lib/tdns/tdns.sqlite
diagnostics:
  listen_addr: "127.0.0.1:6060"
  metrics_enabled: true
  pprof_enabled: false
dns_access:
  allowed_client_cidrs: []
  client_queries_per_second: 100
  client_burst: 200
  global_responses_per_second: 1000
  global_response_burst: 2000
  max_concurrent_upstreams: 128
  max_tracked_clients: 4096
  client_idle_timeout: 10m
auth:
  issuer: tdns
  bearer_audience: tdns-management-api
  active_key:
    id: ""
    environment: TDNS_AUTH_ACTIVE_KEY
    file: ""
    value: ""
  previous_key:
    id: ""
    environment: TDNS_AUTH_PREVIOUS_KEY
    file: ""
    value: ""
  previous_key_accept_until: ""
  browser:
    remember_days: 10
blacklist:
  enabled: true
  file: /var/lib/tdns/bhole_list
  external_file: /alternates/gambling/hosts
  external_repo: https://github.com/StevenBlack/hosts.git
  external_repo_branch: master
  external_pull_period: "0 */6 * * *"
  excludes:
    - domain.tld
    - facebook.com
zen_mode:
  enabled: true
  file: ""
  domains:
    - www.facebook.com
    - www.instagram.com
    - x.com
  excludes: []
  labels: []
  time: 20
static_response:
  enabled: true
  file: /etc/tdns/hostsfile_list
  labels:
    - nostaic
stub_resolver:
  enabled: true
  stubs:
    - google.com,udp://8.8.8.8,udp://8.8.4.4
    - google.es,udp://8.8.8.8,udp://8.8.4.4
server:
  listen_addr: "127.0.0.1:8053"
  api_addr: "127.0.0.1:8443"
  swagger_enabled: false
  api_cert_file: /etc/tdns/tdns_cert.pem
  api_key_file: /etc/tdns/tdns_key.pem
  signing_key: ""
client:
  token: ""
  server: https://localhost:8443
  ca_cert: /etc/tdns/tdns_cert.pem
status:
  enabled: true
  expose_stats: false
  expose_uptime: false
tagger:
  enabled: true
