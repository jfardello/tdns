openapi: 3.0.0
info:
  contact: {}
  description: Configure and inspect a running TDNS server.
  title: TDNS Management API
  version: "1.0"
paths:
  /api/auth/exchange:
    post:
      description: Consume a single-use browser login code and create a browser session.
      operationId: browserCodeExchange
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/api.BrowserCodeExchangeRequest"
        description: Browser login code
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.BrowserSessionResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.ErrorResponse"
        "415":
          description: Unsupported Media Type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.ErrorResponse"
        "429":
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.ErrorResponse"
      summary: Exchange browser login code
      tags:
        - authentication
  /api/auth/login:
    post:
      description: Verify the local administrator credential and create an opaque browser session.
      operationId: browserPasswordLogin
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/api.BrowserPasswordLoginRequest"
        description: Administrator credentials
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.BrowserSessionResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.ErrorResponse"
        "413":
          description: Request Entity Too Large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.ErrorResponse"
        "415":
          description: Unsupported Media Type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.ErrorResponse"
        "429":
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.ErrorResponse"
        "503":
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.ErrorResponse"
      summary: Log in with administrator password
      tags:
        - authentication
  /api/auth/logout:
    post:
      description: Revoke and clear the active browser session.
      operationId: browserSessionLogout
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.ErrorResponse"
      summary: Log out browser session
      tags:
        - authentication
  /api/auth/session:
    get:
      description: Return the active browser session and issue a CSRF token.
      operationId: browserSessionGet
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.BrowserSessionResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.ErrorResponse"
      summary: Get browser session
      tags:
        - authentication
  /api/blacklist:
    get:
      description: Return blacklist sources, exclusions, and runtime state.
      operationId: blacklistStatus
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Response"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: string
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                type: string
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Response"
      security:
        - BearerAuth: []
        - CookieAuth: []
      summary: Get blacklist status
      tags:
        - blacklist
  "/api/blacklist/{action}":
    post:
      description: Enable or disable blacklist filtering.
      operationId: blacklistToggle
      parameters:
        - description: Requested state
          in: path
          name: action
          required: true
          schema:
            type: string
            enum:
              - start
              - stop
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Response"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Response"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: string
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                type: string
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Response"
      security:
        - BearerAuth: []
        - CookieAuth: []
      summary: Toggle blacklist filtering
      tags:
        - blacklist
  /api/blacklist/persisted/excludes:
    post:
      description: Replace blacklist exclusion selectors stored in configuration overrides.
      operationId: blacklistPersistedExcludesReplace
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/api.BlacklistExcludesRequest"
        description: Persisted blacklist exclusions
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Response"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Response"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: string
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                type: string
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Response"
      security:
        - BearerAuth: []
        - CookieAuth: []
      summary: Replace persisted blacklist exclusions
      tags:
        - blacklist
  /api/blacklist/persisted/hosts:
    post:
      description: Replace additional blocked hosts stored in configuration overrides.
      operationId: blacklistPersistedHostsReplace
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/api.BlacklistHostsRequest"
        description: Persisted blacklist hosts
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Response"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Response"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: string
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                type: string
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Response"
      security:
        - BearerAuth: []
        - CookieAuth: []
      summary: Replace persisted blacklist hosts
      tags:
        - blacklist
  /api/blacklist/whitelist:
    post:
      description: Add domains to the in-memory blacklist whitelist.
      operationId: blacklistRuntimeWhitelistAdd
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/api.BlacklistWhitelistRequest"
        description: Runtime whitelist domains
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Response"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Response"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: string
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                type: string
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Response"
      security:
        - BearerAuth: []
        - CookieAuth: []
      summary: Add runtime whitelist domains
      tags:
        - blacklist
  /api/cache:
    delete:
      description: Delete all currently cached DNS responses.
      operationId: cacheClear
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Response"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: string
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                type: string
      security:
        - BearerAuth: []
        - CookieAuth: []
      summary: Clear the DNS cache
      tags:
        - cache
    get:
      description: Return cache configuration and counters.
      operationId: cacheStatus
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Response"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: string
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                type: string
      security:
        - BearerAuth: []
        - CookieAuth: []
      summary: Get cache status
      tags:
        - cache
  "/api/cache/{action}":
    post:
      description: Enable or disable the cache and persist the selected state.
      operationId: cacheToggle
      parameters:
        - description: Requested state
          in: path
          name: action
          required: true
          schema:
            type: string
            enum:
              - start
              - stop
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Response"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Response"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: string
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                type: string
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Response"
      security:
        - BearerAuth: []
        - CookieAuth: []
      summary: Toggle the DNS cache
      tags:
        - cache
  /api/cache/excludes:
    post:
      description: Replace and persist selectors excluded from caching.
      operationId: cacheExcludesReplace
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/api.CacheExcludeRequest"
        description: Cache exclusion selectors
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Response"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Response"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: string
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                type: string
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Response"
      security:
        - BearerAuth: []
        - CookieAuth: []
      summary: Replace cache exclusions
      tags:
        - cache
  /api/dns-log/alias:
    post:
      description: Associate a client IP address with a display name.
      operationId: dnsLogAliasSet
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/api.DNSLogAliasRequest"
        description: Client alias
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Response"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: string
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                type: string
      security:
        - BearerAuth: []
        - CookieAuth: []
      summary: Set a DNS client alias
      tags:
        - dns-log
  /api/dns-log/clients:
    get:
      description: Search observed clients by address or alias.
      operationId: dnsLogClientsSearch
      parameters:
        - description: Address or alias substring
          in: query
          name: search
          schema:
            type: string
        - description: Maximum result count
          in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Response"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: string
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                type: string
      security:
        - BearerAuth: []
        - CookieAuth: []
      summary: Search DNS clients
      tags:
        - dns-log
  /api/dns-log/dashboard:
    get:
      description: Return summary and hourly query statistics.
      operationId: dnsLogDashboard
      parameters:
        - description: Dashboard window in hours
          in: query
          name: hours
          schema:
            type: integer
            minimum: 1
            maximum: 336
            default: 24
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Response"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: string
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                type: string
      security:
        - BearerAuth: []
        - CookieAuth: []
      summary: Get DNS log dashboard
      tags:
        - dns-log
  /api/dns-log/dashboard/current:
    get:
      description: Calculate statistics for the current partial UTC hour.
      operationId: dnsLogDashboardCurrent
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Response"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: string
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                type: string
      security:
        - BearerAuth: []
        - CookieAuth: []
      summary: Get current dashboard hour
      tags:
        - dns-log
  /api/dns-log/dashboard/history:
    get:
      description: Return the cached statistics for the previous 23 completed UTC hours.
      operationId: dnsLogDashboardHistory
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Response"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: string
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                type: string
      security:
        - BearerAuth: []
        - CookieAuth: []
      summary: Get completed dashboard hours
      tags:
        - dns-log
  /api/dns-log/rotate:
    post:
      description: Delete DNS log entries selected by a relative duration.
      operationId: dnsLogRotate
      parameters:
        - description: Relative age such as 24h or 1w
          in: query
          name: since
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Response"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: string
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                type: string
      security:
        - BearerAuth: []
        - CookieAuth: []
      summary: Rotate DNS log entries
      tags:
        - dns-log
  "/api/dns-log/top/{top}":
    get:
      description: Return top domains with optional status and client filters.
      operationId: dnsLogTop
      parameters:
        - description: Maximum result count
          in: path
          name: top
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 50
        - description: Relative age such as 24h or 1w
          in: query
          name: since
          schema:
            type: string
        - description: Query disposition
          in: query
          name: status
          schema:
            type: string
            enum:
              - blocked
              - allowed
        - description: Client alias or IP address
          in: query
          name: client
          schema:
            type: string
        - description: Client matching mode
          in: query
          name: client_mode
          schema:
            type: string
            enum:
              - host
              - ip
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Response"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: string
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                type: string
      security:
        - BearerAuth: []
        - CookieAuth: []
      summary: Get top queried domains
      tags:
        - dns-log
  /api/static-response:
    get:
      description: Return configured, persisted, and runtime static hosts.
      operationId: staticResponseStatus
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Response"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: string
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                type: string
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Response"
      security:
        - BearerAuth: []
        - CookieAuth: []
      summary: Get static response status
      tags:
        - static-response
    post:
      description: Replace static hosts held in memory.
      operationId: staticResponseReplace
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/api.StaticReplaceRequest"
        description: Runtime hosts file lines
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Response"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Response"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: string
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                type: string
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Response"
      security:
        - BearerAuth: []
        - CookieAuth: []
      summary: Replace runtime static hosts
      tags:
        - static-response
  "/api/static-response/{action}":
    post:
      description: Enable or disable static DNS responses.
      operationId: staticResponseToggle
      parameters:
        - description: Requested state
          in: path
          name: action
          required: true
          schema:
            type: string
            enum:
              - start
              - stop
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Response"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Response"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: string
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                type: string
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Response"
      security:
        - BearerAuth: []
        - CookieAuth: []
      summary: Toggle static responses
      tags:
        - static-response
  /api/static-response/persisted:
    post:
      description: Replace static hosts stored in configuration overrides.
      operationId: staticResponsePersistedReplace
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/api.StaticReplaceRequest"
        description: Persisted hosts file lines
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Response"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Response"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: string
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                type: string
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Response"
      security:
        - BearerAuth: []
        - CookieAuth: []
      summary: Replace persisted static hosts
      tags:
        - static-response
  /api/stub-resolver:
    get:
      description: Return configured and runtime stub resolver state.
      operationId: stubResolverStatus
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Response"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: string
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                type: string
      security:
        - BearerAuth: []
        - CookieAuth: []
      summary: Get stub resolver status
      tags:
        - stub-resolver
    post:
      description: Replace the in-memory stub resolver entries.
      operationId: stubResolverReplace
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/api.StubReplaceRequest"
        description: Stub resolver entries
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Response"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Response"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: string
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                type: string
      security:
        - BearerAuth: []
        - CookieAuth: []
      summary: Replace runtime stub resolvers
      tags:
        - stub-resolver
  "/api/stub-resolver/{action}":
    post:
      description: Enable or disable stub resolution.
      operationId: stubResolverToggle
      parameters:
        - description: Requested state
          in: path
          name: action
          required: true
          schema:
            type: string
            enum:
              - start
              - stop
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Response"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.Response"
        "401":
          description: Unauthorized
          content:
            application/json:
