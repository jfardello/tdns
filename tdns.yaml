timeout: 1000
upstream_timeout: 300
verify_tls: true
enable_api: false
loglevel: INFO
upstreams:
  - tls://1.1.1.1:853#cloudflare-dns.com
  - tls://1.0.0.1:853#cloudflare-dns.com
cache:
  enabled: true
  ttl: 5
  excludes: []
cors:
  enabled: false
  allowed_origins:
    - http://localhost:3000
    - https://localhost:3000
dns_log:
  enabled: true
  purge: 180d
database:
  file: /tmp/tdns.sqlite
blacklist:
  enabled: true
  file: /tmp/tds-bhole-file
  external_file: /alternates/gambling/hosts
  external_repo: https://github.com/StevenBlack/hosts.git
  external_repo_branch: master
  external_pull_period: "0 */6 * * *"
  excludes:
    - domain.tld
    - facebook.com
zen_mode:
  enabled: true
  file: ./fixtures/zen_file
  domains:
    - www.facebook.com
    - www.instagram.com
    - x.com
  excludes: []
  labels: []
  time: 20
static_response:
  enabled: true
  file: fixtures/hosts_testfile
  labels:
    - nostaic
stub_resolver:
  enabled: true
  stubs:
    - google.com,udp://8.8.8.8,udp://8.8.4.4
    - google.es,udp://8.8.8.8,udp://8.8.4.4
server:
  listen_addr: ":8053"
  api_addr: ":8443"
  swagger_enabled: true
  pprof_addr: ""
  api_cert_file: fixtures/tdns.crt
  api_key_file: fixtures/tdns.key
  signing_key: ""
client:
  token: ""
  server: https://localhost:8443
  ca_cert: fixtures/tdns.crt
status:
  enabled: true
  expose_stats: true
  expose_uptime: true
tagger:
  enabled: true
