    name: zen-mode
  - description: DNS cache configuration and state.
    name: cache
  - description: Blacklist configuration and state.
    name: blacklist
  - description: Static DNS response configuration and state.
    name: static-response
  - description: DNS query log reports and maintenance.
    name: dns-log
  - description: Client address labels and known hosts.
    name: tagger
  - description: Browser authentication session endpoints.
    name: authentication
servers:
  - url: /
components:
  requestBodies:
    api.ReplaceMemberLabelsRequest:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/api.ReplaceMemberLabelsRequest"
      description: Replacement tags
      required: true
  securitySchemes:
    BearerAuth:
      description: Bearer token using the format "Bearer {token}".
      in: header
      name: Authorization
      type: apiKey
    CookieAuth:
      description: Opaque HttpOnly browser session cookie set by the browser-code exchange or password login.
      in: cookie
      name: __Host-tdns-session
      type: apiKey
  schemas:
    api.AddMemberRequest:
      properties:
        members:
          items:
            type: string
          type: array
      type: object
    api.AddTagRequest:
      properties:
        name:
          example: trusted
          type: string
      type: object
    api.BlacklistExcludesRequest:
      properties:
        excludes:
          items:
            type: string
          type: array
      type: object
    api.BlacklistHostsRequest:
      properties:
        hosts:
          items:
            type: string
          type: array
      type: object
    api.BlacklistStatus:
      properties:
        blockfile_total_entries:
          type: integer
        enabled:
          type: boolean
        excludes:
          items:
            type: string
          type: array
        external_file:
          type: string
        external_pull_period:
          type: string
        external_repo:
          type: string
        external_repo_branch:
          type: string
        file:
          type: string
        persisted_excludes:
          items:
            type: string
          type: array
        persisted_hosts:
          items:
            type: string
          type: array
        runtime_whitelist:
          items:
            type: string
          type: array
      type: object
    api.BlacklistWhitelistRequest:
      properties:
        domains:
          items:
            type: string
          type: array
      type: object
    api.BrowserCodeExchangeRequest:
      properties:
        code:
          type: string
        remember:
          type: boolean
      type: object
    api.BrowserPasswordLoginRequest:
      properties:
        password:
          format: password
          type: string
        remember:
          type: boolean
        username:
          example: admin
          type: string
      type: object
    api.BrowserSessionResponse:
      properties:
        csrf_token:
          type: string
        expires_at:
          format: date-time
          type: string
        scope:
          type: string
        subject:
          type: string
      type: object
    api.CacheExcludeRequest:
      properties:
        excludes:
          items:
            type: string
          type: array
      type: object
    api.CacheStatus:
      properties:
        enabled:
          type: boolean
        excludes:
          items:
            type: string
          type: array
        hits:
          type: integer
        misses:
          type: integer
        ttl:
          type: integer
      type: object
    api.ClientCandidate:
      properties:
        address:
          example: 192.0.2.10
          type: string
        host:
          example: office
          type: string
      type: object
    api.DNSLogAliasRequest:
      properties:
        addr:
          example: 192.0.2.10
          type: string
        name:
          example: office
          type: string
      type: object
    api.DashboardHourlyPoint:
      properties:
        allowed_queries:
          type: integer
        blocked_queries:
          type: integer
        hour_bucket:
          type: integer
        hour_start:
          type: string
        total_queries:
          type: integer
      type: object
    api.DashboardSummary:
      properties:
        allowed_queries:
          type: integer
        blocked_queries:
          type: integer
        cache_hits:
          type: integer
        cache_misses:
          type: integer
        total_queries:
          type: integer
      type: object
    api.ErrorResponse:
      properties:
        error:
          type: string
      type: object
    api.HostEntry:
      properties:
        address:
          example: 192.0.2.10
          type: string
        domain:
          example: example.com
          type: string
      type: object
    api.KnownHost:
      properties:
        address:
          example: 192.0.2.10
          type: string
        host:
          example: office
          type: string
      type: object
    api.LogDetails:
      properties:
        counter:
          example: 42
          minimum: 0
          type: integer
        domain:
          example: example.com.
          type: string
        host:
          example: office
          type: string
      type: object
    api.MemberLabelsRequest:
      properties:
        address:
          example: 192.0.2.10
          type: string
        tags:
          items:
            type: string
          type: array
      type: object
    api.ReplaceMemberLabelsRequest:
      properties:
        tags:
          items:
            type: string
          type: array
      type: object
    api.Response:
      properties:
        blacklist:
          $ref: "#/components/schemas/api.BlacklistStatus"
        cache:
          $ref: "#/components/schemas/api.CacheStatus"
        clients:
          items:
            $ref: "#/components/schemas/api.ClientCandidate"
          type: array
        current_status:
          example: enabled
          type: string
        hourly:
          items:
            $ref: "#/components/schemas/api.DashboardHourlyPoint"
          type: array
        items:
          items:
            type: string
          type: array
        kind:
          example: api.tdns/cache/response
          type: string
        known_hosts:
          items:
            $ref: "#/components/schemas/api.KnownHost"
          type: array
        log_items:
          items:
            $ref: "#/components/schemas/api.LogDetails"
          type: array
        message:
          example: Status OK
          type: string
        static_response:
          $ref: "#/components/schemas/api.StaticResponseStatus"
        stub_resolver:
          $ref: "#/components/schemas/api.StubResolverStatus"
        summary:
          $ref: "#/components/schemas/api.DashboardSummary"
        tag_members:
          items:
            $ref: "#/components/schemas/api.TagMember"
          type: array
        window_hours:
          maximum: 336
          minimum: 1
          type: integer
        zen_mode:
          $ref: "#/components/schemas/api.ZenModeStatus"
      type: object
    api.StaticReplaceRequest:
      properties:
        hosts:
          items:
            type: string
          type: array
      type: object
    api.StaticResponseStatus:
      properties:
        configured_hosts:
          items:
            $ref: "#/components/schemas/api.HostEntry"
          type: array
        enabled:
          type: boolean
        file:
          type: string
        labels:
          items:
            type: string
          type: array
        persisted_hosts:
          items:
            $ref: "#/components/schemas/api.HostEntry"
          type: array
        runtime_hosts:
          items:
            $ref: "#/components/schemas/api.HostEntry"
          type: array
      type: object
    api.StubReplaceRequest:
      properties:
        stubs:
          items:
            type: string
          type: array
      type: object
    api.StubResolverStatus:
      properties:
        configured_stubs:
          items:
            type: string
          type: array
        enabled:
          type: boolean
        runtime_stubs:
          items:
            type: string
          type: array
      type: object
    api.TagMember:
      properties:
        address:
          example: 192.0.2.10
          type: string
        has_host_alias:
          type: boolean
        host:
          example: office
          type: string
      type: object
    api.ZenExcludesRequest:
      properties:
        excludes:
          items:
            type: string
